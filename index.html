<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cartoon</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #87ceeb;
            text-align: center;
        }

        h1 {
            color: #222;
            margin-top: 30px;
        }

        .cartoon {
            width: 250px;
            height: 300px;
            margin: 50px auto;
            position: relative;
        }

        /* Head */
        .head {
            width: 200px;
            height: 200px;
            background: #ffd166;
            border: 5px solid #222;
            border-radius: 50%;
            position: absolute;
            left: 25px;
            top: 20px;
        }

        /* Eyes */
        .eye {
            width: 30px;
            height: 40px;
            background: white;
            border: 3px solid #222;
            border-radius: 50%;
            position: absolute;
            top: 55px;
        }

        .eye.left {
            left: 45px;
        }

        .eye.right {
            right: 45px;
        }

        .pupil {
            width: 12px;
            height: 18px;
            background: #222;
            border-radius: 50%;
            margin: 10px auto;
        }

        /* Nose */
        .nose {
            width: 20px;
            height: 25px;
            background: #f4a261;
            border: 3px solid #222;
            border-radius: 50%;
            position: absolute;
            top: 105px;
            left: 87px;
        }

        /* Mouth */
        .mouth {
            width: 80px;
            height: 40px;
            border-bottom: 5px solid #222;
            border-radius: 50%;
            position: absolute;
            left: 57px;
            top: 125px;
        }

        /* Ears */
        .ear {
            width: 45px;
            height: 60px;
            background: #ffd166;
            border: 5px solid #222;
            border-radius: 50%;
            position: absolute;
            top: 85px;
        }

        .ear.left {
            left: -10px;
        }

        .ear.right {
            right: -10px;
        }

        footer {
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>

<body>

    <h1>🎨 My Cartoon Character</h1>

    <div class="cartoon">

        <div class="ear left"></div>
        <div class="ear right"></div>

        <div class="head">

            <div class="eye left">
                <div class="pupil"></div>
            </div>

            <div class="eye right">
                <div class="pupil"></div>
            </div>

            <div class="nose"></div>

            <div class="mouth"></div>

        </div>

    </div>

    <footer>
        <p>Created by Rahul 🚀</p>
    </footer>

</body>
</html>

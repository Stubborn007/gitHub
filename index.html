```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                -45deg,
                #0f2027,
                #203a43,
                #2c5364,
                #141e30
            );
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        /* Background animation */
        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Floating circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            animation: float 8s infinite ease-in-out;
        }

        .circle1 {
            width: 180px;
            height: 180px;
            top: 10%;
            left: 10%;
        }

        .circle2 {
            width: 250px;
            height: 250px;
            bottom: -50px;
            right: 10%;
            animation-delay: 2s;
        }

        .circle3 {
            width: 100px;
            height: 100px;
            top: 20%;
            right: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-40px);
            }
        }

        /* Main card */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 700px;
            padding: 60px 40px;
            text-align: center;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.3);

            animation: cardEntry 1.5s ease;
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(80px) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Rocket */
        .rocket {
            font-size: 70px;
            display: inline-block;

            animation:
                rocketFloat 3s ease-in-out infinite,
                rocketRotate 2s ease-in-out infinite;
        }

        @keyframes rocketFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes rocketRotate {
            0%, 100% {
                rotate: -5deg;
            }

            50% {
                rotate: 5deg;
            }
        }

        h1 {
            margin-top: 20px;
            font-size: 48px;
            color: white;
            letter-spacing: 2px;

            animation: titleAnimation 2s ease;
        }

        @keyframes titleAnimation {
            from {
                opacity: 0;
                letter-spacing: 20px;
            }

            to {
                opacity: 1;
                letter-spacing: 2px;
            }
        }

        h2 {
            margin-top: 15px;
            color: #00e5ff;
            font-size: 24px;
        }

        p {
            margin: 25px auto;
            max-width: 550px;
            color: #eeeeee;
            font-size: 18px;
            line-height: 1.7;
        }

        /* Button */
        .btn {
            display: inline-block;
            padding: 15px 35px;
            margin-top: 15px;

            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;

            border: 2px solid #00e5ff;
            border-radius: 50px;

            transition: all 0.4s ease;
        }

        .btn:hover {
            background: #00e5ff;
            color: #111;

            transform: scale(1.1);

            box-shadow:
                0 0 10px #00e5ff,
                0 0 30px #00e5ff,
                0 0 60px #00e5ff;
        }

        /* Status */
        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;

            border-radius: 30px;

            background: rgba(0, 255, 100, 0.15);
            border: 1px solid rgba(0, 255, 100, 0.5);

            color: #00ff88;
            font-weight: bold;

            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 5px rgba(0, 255, 100, 0.3);
            }

            50% {
                box-shadow: 0 0 25px rgba(0, 255, 100, 0.7);
            }
        }

        /* Footer */
        footer {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .container {
                padding: 45px 25px;
            }

            h1 {
                font-size: 35px;
            }

            h2 {
                font-size: 20px;
            }

            p {
                font-size: 16px;
            }

            .rocket {
                font-size: 55px;
            }
        }
    </style>
</head>

<body>

    <!-- Animated background -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <!-- Main content -->
    <div class="container">

        <div class="rocket">🚀</div>

        <h1>Welcome!</h1>

        <h2>Jenkins + Nginx Deployment</h2>

        <p>
            Your application has been successfully deployed
            using a CI/CD pipeline. This page is powered by
            HTML, CSS, Jenkins and Nginx.
        </p>

        <div class="status">
            ● SERVER ONLINE
        </div>

        <br>

        <a href="#" class="btn">
            Explore Deployment
        </a>

        <footer>
            DevOps Project © 2026
        </footer>

    </div>

</body>
</html>
```
